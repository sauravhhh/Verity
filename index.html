<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Verity</title>
<meta name="description" content="Check if a photo is AI-generated">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#111111">
<style>
:root{
  --bg:#ffffff; --surface:#f7f7f7; --text:#111111; --muted:#737373;
  --border:#e8e8e8; --accent:#111111; --on-accent:#ffffff;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#0c0c0c; --surface:#161616; --text:#f5f5f5; --muted:#a3a3a3;
    --border:#262626; --accent:#f5f5f5; --on-accent:#111111;
  }
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
body{
  margin:0; background:var(--bg); color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  min-height:100vh; display:flex; flex-direction:column;
  -webkit-font-smoothing:antialiased;
}
header{display:flex; align-items:center; gap:10px; padding:14px 20px; border-bottom:1px solid var(--border);}
header .app-icon{width:32px; height:32px; border-radius:9px; display:block;}
header h1{font-size:19px; margin:0; font-weight:700; letter-spacing:.2px;}
main{flex:1; width:100%; max-width:520px; margin:0 auto; padding:24px 18px 36px;}
.card{background:var(--surface); border:1px solid var(--border); border-radius:20px; padding:22px; margin-bottom:16px;}
#drop{
  border:1.5px dashed var(--border); border-radius:16px; padding:40px 20px 34px;
  text-align:center; cursor:pointer; transition:border-color .2s, background .2s;
  background:var(--bg);
}
#drop:hover, #drop.over{border-color:var(--muted);}
#drop .up-icon{width:46px; height:46px; color:var(--muted); margin-bottom:12px;}
#drop .t1{margin:0; font-size:17px; font-weight:700;}
#drop .t2{margin:6px 0 0; color:var(--muted); font-size:14px;}
#preview{
  display:none; width:100%; border-radius:14px; margin-top:16px;
  max-height:320px; object-fit:contain; background:var(--bg);
  border:1px solid var(--border);
}
#result{display:none; text-align:center;}
.verdict{
  display:inline-block; font-size:19px; font-weight:800; letter-spacing:.2px;
  padding:12px 26px; border-radius:999px; margin:6px 0 10px;
}
.v-ai{background:#fee2e2; color:#b91c1c;}
.v-real{background:#dcfce7; color:#15803d;}
.v-mid{background:#fef3c7; color:#b45309;}
@media (prefers-color-scheme: dark){
  .v-ai{background:#3a1c1c; color:#fca5a5;}
  .v-real{background:#122e1c; color:#86efac;}
  .v-mid{background:#372a10; color:#fcd34d;}
}
#note{color:var(--muted); font-size:15px; line-height:1.55; margin:0;}
#signals{list-style:none; margin:16px 0 0; padding:0; text-align:left;}
#signals li{display:flex; gap:12px; padding:13px 2px; border-top:1px solid var(--border);}
#signals .dot{flex:0 0 9px; width:9px; height:9px; border-radius:50%; margin-top:6px;}
.s-ai .dot{background:#dc2626;}
.s-real .dot{background:#16a34a;}
.s-mid .dot{background:#d97706;}
#signals strong{display:block; font-size:15px; margin-bottom:3px; font-weight:700;}
#signals p{margin:0; font-size:14px; color:var(--muted); line-height:1.5;}
#meta{font-size:13px; color:var(--muted); margin:14px 0 0; text-align:center;}
.hint{font-size:13px; color:var(--muted); text-align:center; line-height:1.65; margin:6px 10px 0;}
footer{text-align:center; padding:18px; font-size:13px; color:var(--muted); border-top:1px solid var(--border);}
#toast{
  position:fixed; left:50%; bottom:32px; transform:translateX(-50%) translateY(20px);
  background:var(--text); color:var(--bg); padding:10px 20px; border-radius:24px;
  font-size:14px; opacity:0; pointer-events:none; transition:.25s;
}
#toast.show{opacity:1; transform:translateX(-50%) translateY(0);}
</style>
</head>
<body>
<header>
  <img class="app-icon" src="icon-192.png" alt="Verity icon">
  <h1>Verity</h1>
</header>
<main>
  <div class="card">
    <div id="drop" role="button" tabindex="0" aria-label="Choose a photo">
      <svg class="up-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="9" cy="9" r="1.6"/><path d="m21 15-4.5-4.5L6 21"/></svg>
      <p class="t1">Choose a photo</p>
      <p class="t2">or drag &amp; drop it here</p>
    </div>
    <input type="file" id="file" accept="image/*" hidden>
    <img id="preview" alt="Selected photo">
  </div>

  <div class="card" id="result">
    <span class="verdict" id="verdict"></span>
    <p id="note"></p>
    <ul id="signals"></ul>
    <p id="meta"></p>
  </div>

  <p class="hint">Verity reads technical traces inside the file, such as metadata and generator signatures. It does not analyze pixels, and metadata can be stripped or faked, so treat the result as a clue, not proof.</p>
</main>
<footer>Made with ❤️ by sauravhhh</footer>
<div id="toast"></div>
<script src="app.js"></script>
<script>
if('serviceWorker' in navigator){ navigator.serviceWorker.register('sw.js').catch(function(){}); }
</script>
</body>
</html>
